<script>
const frases = [
  "No necesitas motivación, necesitas disciplina.",
  "Hazlo aunque no tengas ganas.",
  "Cada día cuenta.",
  "El dolor es temporal, el orgullo es eterno.",
  "Si fuera fácil, todos lo harían.",
  "Haz lo que dijiste que harías.",
  "Menos excusas, más acción.",
  "Tu yo futuro te está mirando."
];

let ultimaFrase = -1;

function nuevaFrase() {
  let random;
  do {
    random = Math.floor(Math.random() * frases.length);
  } while (random === ultimaFrase);

  ultimaFrase = random;
  document.getElementById("frase").innerText = frases[random];
}

nuevaFrase();

// partículas fondo
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    d: Math.random() * 1
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";
  ctx.globalAlpha = 0.6;

  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }

  update();
}

function update() {
  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    p.y += p.d;

    if (p.y > canvas.height) {
      p.y = 0;
      p.x = Math.random() * canvas.width;
    }
  }
}

setInterval(draw, 33);
</script>

</body>
